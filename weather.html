<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter City" spellcheck="false">
            <button><img src="https://img.icons8.com/?size=160&id=1gzwu5aKK4Xx&format=png" ></button>
        </div>
        <div class="error">
           <p>Invalid City Name</p> 
        </div>
        <div class="weather">
        <img src="/images/rain.png" class="weather-icon">
        <h1 class="temp">04°C</h1>
        <h2 class="city">Srinagar</h2>
    
    <div class="details">
        <div class="col">
            <img src="/images/humidity.png" >
        </div>
        <div>
            <p class="humidity">50%</p>
            <p style="font-size: 12px;">Humudity</p>
        </div>
   
     
        <div class="col">
            <img src="/images/wind.png" >
        </div>
        <div>
            <p class="wind">20Km/h</p>
            <p style="font-size: 12px;">Wind Speed</p>
        </div>
        </div>
     </div>
</div>

<script src="script.js">
</script>
</body>
</html>
